[project]
name = "agentic-imodels"
version = "0.1.0"
description = "Interpretable tabular regressors discovered by agentic loops."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "agentic-imodels contributors" },
]
license = { text = "MIT" }
keywords = [
    "interpretable-ml",
    "tabular",
    "regression",
    "scikit-learn",
    "gam",
    "ebm",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "interpret>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
]
research = [
    "adjusttext>=1.3.0",
    "azure-identity>=1.25.3",
    "datasets>=4.8.3",
    "imodels>=2.0.4",
    "imodelsx>=1.0.13",
    "markdown>=3.10.2",
    "matplotlib>=3.10.0",
    "openai>=2.29.0",
    "openml>=0.14.0",
    "pandas>=2.0.0",
    "pmlb>=1.0.1.post3",
    "pyarrow>=14.0.0",
    "pygam>=0.12.0",
    "torch>=2.10.0",
    "transformers>=5.3.0",
    "weasyprint>=68.1",
    "tabpfn>=7.0.0",
    "pypdf2>=3.0.1",
]

[project.urls]
Homepage = "https://github.com/csinva/agentic-imodels"
Repository = "https://github.com/csinva/agentic-imodels"
Paper = "https://arxiv.org/abs/2605.03808"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_imodels"]

[tool.hatch.build.targets.sdist]
only-include = [
    "agentic_imodels",
    "README.md",
    "SKILL.md",
    "docs/README.md",
    "docs/model-selection.md",
    "docs/api-reference.md",
    "docs/agent-skill.md",
    "docs/development.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
